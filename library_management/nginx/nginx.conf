server {
    listen 80;
    server_name myapp.local;

    # 1. Direct Auth Service Routes (No verification needed)
    location /api/v1/login {
        proxy_pass http://auth_service:8000/api/v1/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Internal verify endpoint used by auth_request
    location = /api/v1/verify {
        internal;
        proxy_pass http://auth_service:8000/api/v1/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # 2. Protected Routes (e.g., Textbook Rental Service)
    location /api/v1/textbook_rental {
        # Trigger auth_service verification
        auth_request /api/v1/verify;

        # If verification fails, return 401 Unauthorized
        error_page 401 = /error401;

        # Extract custom headers from the auth_service response and pass to upstream
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_roles $upstream_http_x_user_roles;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Roles $user_roles;
        
        # Forward to the actual textbook rental service
        proxy_pass http://textbook_rental_service:8080/;
        proxy_set_header Host $host;
    }

    location = /error401 {
        return 401 "{\"error\": \"Unauthorized - Please log in\"}";
        default_type application/json;
    }
}